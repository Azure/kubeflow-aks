name: Publish docs-site to GitHub Pages

on:
  # Trigger the workflow on git push to a branch where this workflow file exists
  push:
    paths:
      # The documentation itself lives in docs/ and is mounted into the site,
      # so a change there has to rebuild too.
      - docs/**
      - docs-site/**
      - .github/workflows/gh-pages.yml
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it part way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # enableGitInfo needs full history to date each page accurately.
          fetch-depth: 0

      # Hugo resolves the Docsy theme as a Hugo module, which needs the Go
      # toolchain. Hugo itself is pinned as an npm devDependency, so there is
      # no separate Hugo install step.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Matches the go directive in docs-site/go.mod.
          go-version: "1.23"
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: docs-site/.nvmrc
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - run: npm ci

      - name: Build the site
        # configure-pages reports the URL Pages actually serves this site from,
        # so the baseURL never has to be reconstructed by hand.
        run: npm run build -- --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Relative to the workspace root, not the working-directory default.
          path: docs-site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
