name: Publish docs-site to GitHub Pages

on:
  # Trigger the workflow on git push to a branch where this workflow file exists
  push:
    paths:
      - docs-site/**
      - .github/workflows/gh-pages.yml
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: docs-site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # enableGitInfo needs full history to date each page accurately.
          fetch-depth: 0

      # Hugo resolves the Docsy theme as a Hugo module, which needs the Go
      # toolchain. Hugo itself is pinned as an npm devDependency, so there is
      # no separate Hugo install step.
      - uses: actions/setup-go@v7
        with:
          # Matches the go directive in docs-site/go.mod.
          go-version: "1.23"
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: docs-site/.nvmrc
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm ci

      - name: Build the site
        # The site publishes under a per-branch directory, so the baseURL is
        # passed on the command line rather than patched into config.toml.
        run: |
          npm run build -- \
            --baseURL "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/kubeflow-aks/${GITHUB_REF_NAME}/"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-site/public
          destination_dir: ${{ github.ref_name }}
