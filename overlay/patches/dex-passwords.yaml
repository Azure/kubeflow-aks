# Upstream ships this Secret with `stringData`, so a strategic merge that sets
# `data` adds a second field beside it rather than replacing it. Kubernetes
# merges `stringData` over `data` on write, so the generated hash loses to
# upstream's published default and Dex accepts `12341234` while
# deploy-kubeflow prints a password that does not work. Remove the field
# upstream owns, then add the one this overlay owns.
#
# A strategic merge cannot express the removal, because deleting a field needs
# a null and the base value is a string. Hence a JSON patch.
- op: remove
  path: /stringData
- op: add
  path: /data
  value:
    DEX_USER_PASSWORD: "@@DEX_PASSWORD_HASH_B64@@"
